<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meerjarenplanning – Brass Band Nuenen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700;800&family=Roboto:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style id="css">
:root{--blue:#0076BE;--blue-d:#005A92;--blue-s:#E6F1F9;--ink:#1A1A1A;--muted:#6B6B6B;--paper:#F8F7F3;--line:#E4E1D8;--red:#C8372D;--row:36px;--lab:240px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.4 Roboto,system-ui,sans-serif}
button,input,select,textarea{font:inherit}
.cond{font-family:"Roboto Condensed",Roboto,sans-serif}
header.top{display:flex;align-items:center;gap:18px;padding:18px 24px 14px;border-bottom:3px solid var(--blue);background:#fff}
header.top img{height:48px}
header.top h1{margin:0;font:800 26px/1 "Roboto Condensed",sans-serif;letter-spacing:-.01em}
header.top .sub{color:var(--muted);font-size:13px;margin-top:4px}
header.top .spacer{flex:1}
.status{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:#bbb}
.status.live::before{background:#2E9E6B}.status.ro::before{background:#D9AE2E}.status.warn::before{background:#C8372D}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:6px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:500}
.btn.primary:hover{background:var(--blue-d);color:#fff}
.btn.danger{color:var(--red)}
.btn.danger:hover{border-color:var(--red)}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 24px}
.toolbar .grp{display:flex;gap:0}
.toolbar .grp .btn{border-radius:0;margin-left:-1px}
.toolbar .grp .btn:first-child{border-radius:6px 0 0 6px;margin-left:0}
.toolbar .grp .btn:last-child{border-radius:0 6px 6px 0}
.toolbar .grp .btn.on{background:var(--blue-s);border-color:var(--blue);color:var(--blue);position:relative;z-index:1}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-left:auto;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px;cursor:pointer;user-select:none}
.legend span.off{opacity:.35;text-decoration:line-through}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.legend i.vc{background:#F6E3A8;border:1px solid #E2C46A}
.legend i.lp{background:repeating-linear-gradient(135deg,#9bbfd9 0 3px,#e6f1f9 3px 6px)}

/* timeline */
.wrap{margin:0 24px;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.scroller{overflow:auto;max-height:calc(100vh - 210px);position:relative}
.grid{position:relative}
.row{display:flex;height:var(--row);border-bottom:1px solid #F1EEE7;width:max-content;min-width:100%}
.row .lab{position:sticky;left:0;z-index:3;width:var(--lab);min-width:var(--lab);background:#fff;border-right:1px solid var(--line);padding:0 10px 0 12px;display:flex;align-items:center;gap:8px;overflow:hidden}
.row .lab .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;cursor:pointer}
.row .lab .nm:hover{color:var(--blue)}
.row .lab .rec{font-size:11px;color:var(--muted);white-space:nowrap}
.row .lab .dot{width:9px;height:9px;border-radius:50%;flex:none}
.row .track{position:relative;flex:none}
.head{position:sticky;top:0;z-index:5;background:#fff}
.head .row{height:auto;border-bottom:1px solid var(--line)}
.head .lab{font:700 11px "Roboto Condensed",sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);align-items:flex-end;padding-bottom:6px}
.yr{position:absolute;top:0;height:26px;border-left:1px solid #cfd9e2;padding:5px 8px;font:800 15px "Roboto Condensed",sans-serif;white-space:nowrap;overflow:hidden}
.yr small{font:400 11px Roboto,sans-serif;color:var(--muted);margin-left:6px}
.mo{position:absolute;top:26px;height:20px;border-left:1px solid #EFECE4;font-size:10.5px;color:var(--muted);padding:3px 0 0 4px;overflow:hidden;white-space:nowrap}
.sec .lab{background:var(--paper);font:700 11px "Roboto Condensed",sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.sec{height:26px;background:var(--paper)}
.vline{position:absolute;top:0;bottom:0;width:1px;background:#F1EEE7;pointer-events:none}
.vline.y{background:#dfe6ec}
.today{position:absolute;top:0;bottom:0;width:2px;background:var(--red);z-index:2;pointer-events:none}
.today.lbl::after{content:"vandaag";position:absolute;top:28px;left:4px;font:700 10px "Roboto Condensed",sans-serif;color:var(--red);text-transform:uppercase;letter-spacing:.08em;background:#fff;padding:0 3px}
.tick{position:absolute;top:9px;height:18px;width:2px;border-radius:1px;background:var(--blue);opacity:.75}
.tick.x{background:var(--red);opacity:1;height:8px;top:14px;width:6px;border-radius:50%;margin-left:-2px}
.tick.r{background:#c9c6bd;opacity:1}
.tick.z{background:#e7c873;opacity:1}
.tick.c{background:#fff;border:2px solid #C8372D;width:7px;height:7px;top:14px;margin-left:-2px;transform:rotate(45deg);opacity:1;border-radius:1px}
.tick.e{background:#fff;border:2px solid var(--blue);width:6px;margin-left:-2px;opacity:1}
.vac{position:absolute;top:7px;height:22px;border-radius:4px;background:#F6E3A8;border:1px solid #E2C46A;color:#7a5b00;font:700 10.5px/20px "Roboto Condensed",sans-serif;padding:0 5px;white-space:nowrap;overflow:hidden;cursor:default}
.vac.summer{background:#F2CF63;border-color:#D9AE2E;cursor:pointer}
.vac.summer:hover{filter:brightness(1.05)}
.vac .q{display:inline-block;background:#fff;color:#a77b00;border-radius:50%;width:14px;height:14px;line-height:14px;text-align:center;margin-left:4px;font-size:10px}
.vshade{position:absolute;top:0;bottom:0;background:rgba(242,207,99,.13);pointer-events:none}
.busy{position:absolute;top:6px;bottom:6px;border-radius:2px}
.prep{position:absolute;top:8px;height:20px;border-radius:5px 0 0 5px;cursor:pointer;z-index:2}
.ev{position:absolute;top:6px;height:24px;border-radius:5px;cursor:pointer;color:#fff;font:700 11px/24px "Roboto Condensed",sans-serif;padding:0 6px;white-space:nowrap;overflow:visible;box-shadow:0 1px 2px rgba(0,0,0,.2);min-width:8px}
.ev.reces{color:#555;box-shadow:none;background:repeating-linear-gradient(135deg,#ddd 0 4px,#eee 4px 8px)!important;border:1px solid #ccc}
.ev.tbd{box-shadow:none;border:1.5px dashed currentColor;text-align:center;padding:0 2px;font-size:12px}
.grip{position:absolute;left:-5px;top:-3px;bottom:-3px;width:12px;cursor:ew-resize;touch-action:none;z-index:3}
.grip::after{content:"";position:absolute;left:4px;top:5px;bottom:5px;width:4px;border-radius:2px;background:#1A1A1A;opacity:0;transition:opacity .15s}
.prep:hover .grip::after,.grip:hover::after,.grip.on::after{opacity:.45}
body.dragging,body.dragging *{cursor:ew-resize!important;user-select:none}
.prep.drag{outline:2px solid currentColor;outline-offset:1px}
.who{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font:700 10px/1 "Roboto Condensed",sans-serif;flex:none;border:2px solid #ccc;color:#555;background:#fff;letter-spacing:.02em}
.who.ok{border-color:#2E9E6B;background:#E7F5EE;color:#1d6b47}
.who.forming{border-color:#D9AE2E;background:#FBF3DA;color:#7a5b00}
.who.none{border-color:#C8372D;background:#FBE9E7;color:#9b2a22}
.who.unk{border-style:dashed;color:#999}
.orgline{font-size:11.5px;margin-top:1px}
.orgline .st{font-weight:700}
.dlg{max-width:600px!important}
.peryear{max-height:300px!important}
.peryear .py{grid-template-columns:44px 1fr auto!important;padding-top:6px!important}
.peryear .py2{display:grid;grid-template-columns:44px 1fr 1fr 1.3fr;gap:6px;padding:0 0 6px;border-bottom:1px solid #F1EEE7}
.peryear .py2:last-child{border-bottom:0}
.peryear .py2 select,.peryear .py2 input{min-width:0;width:100%;padding:5px 7px}
.peryear .py select,.peryear .py input[type=text]{padding:5px 7px;border:1px solid #d6d2c7;border-radius:6px;min-width:0}
.ev.urg-red{box-shadow:0 0 0 2.5px #C8372D,0 0 0 5px rgba(200,55,45,.18)}
.ev.urg-orange{box-shadow:0 0 0 2.5px #D9822B}
.lab.urg-red{box-shadow:inset 4px 0 0 #C8372D;background:#FDF3F2!important}
.lab.urg-orange{box-shadow:inset 4px 0 0 #D9822B;background:#FEF8F0!important}
.lab .ubadge{font:700 10px/1 "Roboto Condensed",sans-serif;color:#fff;border-radius:3px;padding:3px 4px;flex:none;letter-spacing:.03em}
.alert{display:none;margin:0 24px 12px;border-radius:10px;padding:10px 14px;align-items:center;gap:12px;font-size:14px;border:1px solid}
.alert.show{display:flex}
.alert.red{background:#FBE9E7;border-color:#efb8b2;color:#7e1f18}
.alert.orange{background:#FDF0E1;border-color:#f1cf9f;color:#7a4a0c}
.alert b{font-weight:700}
.alert .sp{flex:1}
.up li.urg{border-left:4px solid;padding-left:10px;margin-left:-14px}
.upill{display:inline-block;font:700 10.5px "Roboto Condensed",sans-serif;letter-spacing:.05em;text-transform:uppercase;border-radius:20px;padding:2px 8px;color:#fff}
.ev .t{position:absolute;left:calc(100% + 5px);color:var(--ink);font-weight:700;pointer-events:none}
.ev:hover,.prep:hover{filter:brightness(1.08)}
.empty{padding:40px;text-align:center;color:var(--muted)}

/* bottom panels */
.panels{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;margin:18px 24px 40px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.card h2{margin:0 0 10px;font:800 16px "Roboto Condensed",sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--blue)}
.up{list-style:none;margin:0;padding:0}
.up li{display:grid;grid-template-columns:110px 1fr auto;gap:10px;padding:7px 0;border-bottom:1px solid #F1EEE7;align-items:center}
.up li:last-child{border:0}
.up .d{font:700 13px "Roboto Condensed",sans-serif}
.up .kind{font-size:11px;color:var(--muted)}
.up li.todo .d{color:#a77b00}
.chip{display:inline-block;margin-left:8px;font:700 11px "Roboto Condensed",sans-serif;letter-spacing:.04em;background:#FBEFC7;color:#8a6400;border-radius:20px;padding:2px 8px;vertical-align:middle;text-transform:none}
.peryear{grid-column:1/-1;border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-height:200px;overflow:auto}
.peryear .py{display:grid;grid-template-columns:48px 1fr auto;gap:8px;align-items:center;padding:3px 0}
.peryear .py b{font:700 13px "Roboto Condensed",sans-serif}
.peryear .py input[type=date]{padding:5px 7px}
.peryear .py label{flex-direction:row;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
.up .reps{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.pill{display:inline-block;font-size:10.5px;font-weight:700;border-radius:20px;padding:1px 7px;color:#fff;margin-right:6px;font-family:"Roboto Condensed",sans-serif;letter-spacing:.04em;text-transform:uppercase}
table.yrs{width:100%;border-collapse:collapse;font-size:13px}
table.yrs th{text-align:left;font:700 11px "Roboto Condensed",sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:4px 6px;border-bottom:1px solid var(--line)}
table.yrs td{padding:6px;border-bottom:1px solid #F1EEE7}
table.yrs td.n{text-align:right;font-variant-numeric:tabular-nums}
.small{font-size:12px;color:var(--muted)}

/* tooltip + modal */
#tip{position:fixed;z-index:50;background:#1d2a35;color:#fff;border-radius:7px;padding:8px 10px;font-size:12px;line-height:1.45;pointer-events:none;max-width:290px;display:none;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#tip b{font-family:"Roboto Condensed",sans-serif;font-size:13px}
.ov{position:fixed;inset:0;background:rgba(20,30,40,.45);z-index:60;display:none;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow:auto}
.ov.show{display:flex}
.dlg{background:#fff;border-radius:12px;width:100%;max-width:520px;box-shadow:0 12px 40px rgba(0,0,0,.25);overflow:hidden}
.dlg h3{margin:0;padding:14px 18px;background:var(--blue);color:#fff;font:800 18px "Roboto Condensed",sans-serif;letter-spacing:.02em}
.dlg .body{padding:16px 18px;display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.dlg label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
.dlg label.full{grid-column:1/-1}
.dlg input,.dlg select,.dlg textarea{border:1px solid #d6d2c7;border-radius:6px;padding:8px 9px;color:var(--ink);background:#fff}
.dlg input:focus,.dlg select:focus,.dlg textarea:focus{outline:2px solid var(--blue-s);border-color:var(--blue)}
.dlg .hint{grid-column:1/-1;font-size:12px;color:var(--muted);background:var(--paper);border-radius:6px;padding:8px 10px}
.dlg .foot{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);background:#FBFAF7}
.dlg .foot .sp{flex:1}
.chk{display:flex!important;flex-direction:row!important;align-items:center;gap:8px;color:var(--ink)!important;font-size:13px!important}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1d2a35;color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;z-index:70;display:none}
.short{display:none}
/* agenda view */
.agenda-wrap{padding:6px 18px 14px}
#agenda{max-width:900px}
.ag-month{font:800 15px "Roboto Condensed",sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);margin:16px 0 4px;padding-bottom:4px;border-bottom:2px solid var(--blue-s)}
.ag-month:first-child{margin-top:6px}
.ag{list-style:none;margin:0;padding:0}
.ag li{display:grid;grid-template-columns:54px 1fr;gap:12px;padding:9px 0;border-bottom:1px solid #F1EEE7;align-items:start}
.ag li:last-child{border-bottom:0}
.ag .day{text-align:center;line-height:1.05}
.ag .day b{display:block;font:800 22px "Roboto Condensed",sans-serif}
.ag .day span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.ag .what b{font-size:15px}
.ag .what .kind{font-size:12.5px;color:var(--muted);margin-top:2px}
.ag li.agvac{opacity:.85}
.ag li.agvac .what b{font-weight:500;color:#7a5b00}
.ag li.urg{border-left:4px solid;padding-left:8px}
.ag li[data-go]{cursor:pointer}
.ag-more{display:block;margin:14px auto 4px}
body.view-agenda .tl-only, body.view-agenda .tl-wrap, body.view-agenda .tl-only-card{display:none!important}
body.view-agenda #agendaWrap{display:block!important}
@media (max-width:900px){.panels{grid-template-columns:1fr}:root{--lab:160px}.legend{margin-left:0}}
@media (max-width:760px){
  html,body{overflow-x:hidden;max-width:100vw}
  :root{--lab:128px;--row:34px}
  body{font-size:14px}
  header.top{flex-wrap:wrap;gap:8px 10px;padding:10px 12px}
  header.top img{height:34px}
  header.top h1{font-size:19px}
  header.top .sub{display:none}
  header.top .spacer{display:none}
  .status{order:5;width:100%;font-size:11.5px}
  header.top .btn{padding:7px 10px}
  .long{display:none}.short{display:inline}
  .toolbar{flex-wrap:nowrap;overflow-x:auto;padding:8px 12px;-webkit-overflow-scrolling:touch}
  .toolbar .btn{flex:none}
  .legend{display:none}
  .wrap{margin:0 12px}
  .alert{margin:0 12px 10px;font-size:13px;flex-wrap:wrap}
  .panels{margin:12px 12px 30px;gap:12px;grid-template-columns:minmax(0,1fr)!important}
  .card{min-width:0}
  .up li{grid-template-columns:74px minmax(0,1fr)!important}
  .card{padding:14px}
  .up li{grid-template-columns:74px 1fr;gap:8px}
  .up li .reps{grid-column:2;text-align:left}
  .up li.urg{margin-left:-10px}
  .row .lab{font-size:12px;padding:0 6px 0 8px;gap:5px}
  .row .lab .rec{display:none}
  .who{width:19px;height:19px;font-size:9px}
  .agenda-wrap{padding:4px 12px 12px}
  .ov{padding:0;align-items:flex-end}
  .dlg{max-width:100%!important;width:100%;border-radius:14px 14px 0 0;max-height:92vh;overflow-y:auto;overflow-x:hidden}
  .dlg .body{grid-template-columns:minmax(0,1fr);padding:14px}
  .dlg .body>*{min-width:0}
  .dlg input,.dlg select,.dlg textarea{width:100%;min-width:0;box-sizing:border-box}
  .dlg .foot{flex-wrap:wrap}
  .dlg input,.dlg select,.dlg textarea{font-size:16px}
  .peryear .py2{grid-template-columns:1fr 1fr!important}.peryear .py2>span:first-child{display:none}
  #tip{display:none!important}
  table.yrs{font-size:12px;table-layout:fixed}
  table.yrs th{white-space:normal;font-size:9.5px;letter-spacing:.03em;padding:4px 3px}
  table.yrs td{padding:6px 3px}
}
</style>
</head>
<body>
<script src="config.js"></script>
<script type="application/json" id="state">{"v":1,"settings":{},"events":[]}</script>

// ---------- dates (UTC day numbers) ----------
const DAY=86400000;
const dn = s => { const [y,m,d]=s.split("-").map(Number); return Math.round(Date.UTC(y,m-1,d)/DAY); };
const ds = n => new Date(n*DAY).toISOString().slice(0,10);
const ymd = (y,m,d) => Math.round(Date.UTC(y,m,d)/DAY);
const wd = n => new Date(n*DAY).getUTCDay();
const fmt = n => { const d=new Date(n*DAY); return DAYS[d.getUTCDay()]+" "+d.getUTCDate()+" "+MONTHS[d.getUTCMonth()]+" "+d.getUTCFullYear(); };
const fmtS = n => { const d=new Date(n*DAY); return d.getUTCDate()+" "+MONTHS[d.getUTCMonth()]+" "+d.getUTCFullYear(); };
const now = new Date();
const TODAY = ymd(now.getFullYear(), now.getMonth(), now.getDate());
const Y0 = now.getFullYear(), Y1 = Y0+5;
const START = ymd(Y0,0,1), END = ymd(Y1,11,31)+1;

function easter(y){ const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1; return ymd(y,mo-1,da); }
function holidays(y){
  const e=easter(y), kd=ymd(y,3,27), out={};
  out.nieuwjaar=ymd(y,0,1); out.paasmaandag=e+1; out.koningsdag = wd(kd)===0? kd-1 : kd;
  out.bevrijdingsdag=ymd(y,4,5); out.pinkstermaandag=e+50; out.kerstavond=ymd(y,11,24);
  out.kerst1=ymd(y,11,25); out.kerst2=ymd(y,11,26); out.oudjaar=ymd(y,11,31);
  return out;
}

function orgOf(e,y){ if(+e.recur>0){ const o=(e.yr&&e.yr[y])||{}; return {org:o.org||"", contact:o.contact||"", team:o.team||""}; }
  return { org:e.org||"", contact:e.contact||"", team:e.team||"" }; }

const initials = n => (n||"").trim().split(/\s+/).filter(Boolean).map(w=>w[0]).slice(0,2).join("").toUpperCase();

const URG_RANK={red:0,orange:1,yellow:2};
const daysTxt=d=>{ const n=d-TODAY; return n<0?`${-n} dagen geleden`:n===0?"vandaag":n===1?"morgen":`nog ${n} dagen`; };
function urgencies(){
  const out=[];
  state.events.forEach(e=>{
    if(e.cat==="reces") return;
    const pw=+e.prepWeeks||0;
    if(e.unplanned||!e.date){
      const y=+e.wishYear, dl= y? ymd(y,0,1)-pw*7 : null;
      const level = !y? "orange" : (dl-TODAY<=91? "red" : dl-TODAY<=365? "orange" : "yellow");
      const txt = !y? "Nog geen datum en geen jaar gekozen — bespreken wanneer dit moet plaatsvinden"
        : (dl<TODAY? `Datum had al vast moeten staan om ${y} te halen met ${pw} weken voorbereiding` : `Datum vastleggen vóór ${fmtS(dl)} (${daysTxt(dl)}) om begin ${y} nog ${pw} weken voorbereiding te hebben`);
      out.push({e, y:null, kind:"plan", level, dl: dl??TODAY+365, txt});
      return;
    }
    if(noTeam(e)) return;
    occurrences(e).forEach(o=>{
      const dl = pw? o.s-pw*7 : o.s;
      if(o.e<TODAY || dl>=TODAY+365) return;
      const g=orgOf(e,o.y); if(g.org==="ok") return;
      const level = dl-TODAY<=91? "red" : "orange";
      const what = g.org==="forming"? "Team is nog in vorming" : g.org==="none"? "Nog geen organisatieteam" : "Organisatie nog niet ingevuld";
      const txt = dl<TODAY? `${what} — de voorbereiding is al begonnen (${fmtS(dl)})` : `${what} — team nodig vóór ${fmtS(dl)} (${pw?"start voorbereiding":"evenement"}, ${daysTxt(dl)})`;
      out.push({e, y:o.y, s:o.s, kind:"team", level, dl, txt});
    });
  });
  return out.sort((a,b)=>URG_RANK[a.level]-URG_RANK[b.level] || a.dl-b.dl);
}

function urgOfEvent(e){ let best=null; URGS.forEach(u=>{ if(u.e.id===e.id && (!best||URG_RANK[u.level]<URG_RANK[best])) best=u.level; }); return best; }

function occYears(ev){
  if(ev.unplanned || !ev.date) return [];
  const y0=+ev.date.slice(0,4), step=+ev.recur||0;
  if(!step) return [y0];
  const until=Math.min(+ev.until||Y1, Y1), out=[]; for(let y=y0;y<=until;y+=step) out.push(y); return out;
}
function occurrences(ev){
  if(ev.unplanned || !ev.date) return [];
  const base=dn(ev.date), len = ev.end ? Math.max(0,dn(ev.end)-base) : 0;
  const step = +ev.recur||0, out=[];
  const b=new Date(base*DAY), y0=b.getUTCFullYear();
  const years = occYears(ev);
  years.forEach(y=>{
    if(ev.skip && ev.skip[y]) return;
    const fixed = ev.dates && ev.dates[y];
    if(fixed){ const s=dn(fixed); out.push({s, e:s+len, y}); }
    else if(ev.tbd){ out.push({s:ymd(y,b.getUTCMonth(),1), e:ymd(y,b.getUTCMonth()+1,1)-1, y, tbd:true}); }
    else { const s=ymd(y,b.getUTCMonth(),b.getUTCDate()); out.push({s, e:s+len, y}); }
  });
  return out;
}

function computeReps(){
  const hol={};

  const reces=[];
  state.events.filter(e=>e.cat==="reces").forEach(e=>occurrences(e).forEach(o=>reces.push({s:o.s,e:o.e,name:e.name})));
  const list=[]; let d=START; while(wd(d)!==1) d++;
  for(; d<END; d+=7){
    let st="ok", why="";
    if(hol[d]){ st="x"; why=hol[d]; }
    else { const r=reces.find(r=>d>=r.s&&d<=r.e); if(r){ st="r"; why=r.name; } }
    const v=VACS.find(v=>d>=v.s&&d<=v.e);
    if(st==="ok" && v && v.summer){ if(state.settings.summerOn[ds(d)]){ st="ok"; why="Extra repetitie in de zomervakantie"; list.push({d,st,why,extra:1,vac:v}); continue; } st="z"; why="Zomerstop"; }
    list.push({d,st,why,vac:v});
  }
  const O=state.settings.repOv||{};
  list.forEach(r=>{ const o=O[ds(r.d)]; if(!o) return;
    if(o.s==="cancel"){ r.st="c"; r.why="Geannuleerd"+(o.note?": "+o.note:""); r.ov=1; delete r.extra; }
    else if(o.s==="on" && r.st!=="ok"){ r.prev=r.why; r.st="ok"; r.extra=1; r.why="Extra repetitie"+(o.note?": "+o.note:""); r.ov=1; r.time=o.time; } });
  Object.entries(O).forEach(([k,o])=>{ if(o.s!=="extra") return; const d=dn(k); if(d<START||d>=END||list.some(r=>r.d===d)) return;
    list.push({d, st:"ok", extra:1, ov:1, time:o.time, why:"Extra repetitie"+(o.note?": "+o.note:"")}); });
  state.events.filter(e=>e.cat==="repetitie").forEach(e=>occurrences(e).forEach(o=>{ for(let d=o.s; d<=o.e; d++){ if(d<START||d>=END) continue;
    const r=list.find(x=>x.d===d), why=e.name+(e.note?" · "+e.note:"");
    if(r){ if(r.st!=="c"){ r.st="ok"; r.why=why; r.evRep=e.id; } }
    else list.push({d, st:"ok", extra:1, evRep:e.id, why}); } }));
  return list.sort((a,b)=>a.d-b.d);
}

      org: noTeam(e)?"": (()=>{ const g=orgOf(e,o.y), st=ORG[g.org], uc=URGMAP[urgKey(e.id,o.y)]; return [(uc&&uc!=="yellow"?URG[uc].nl.toUpperCase()+": ":"")+(st?st.nl:"Niet ingevuld"), g.contact?"Aanspreekpunt: "+g.contact:"", g.team?"Team: "+g.team:""].filter(Boolean).join("\n"); })() }); }));
  REPS.filter(r=>r.ov&&r.d>=R.a&&r.d<R.b).forEach(r=>out.push({d:r.d, date:fmt(r.d)+(r.st!=="c"&&r.time?" "+r.time:""), name:r.st==="c"?"Repetitie geannuleerd":"Extra repetitie", cat:"Repetitie", prep:"–", reps:"", org:"", note:r.why.includes(": ")?r.why.split(": ").slice(1).join(": "):""}));
  VACS.filter(v=>v.summer&&v.e>=R.a&&v.s<R.b).forEach(v=>{ const y=new Date(v.s*DAY).getUTCFullYear(), on=vacMondays(v).filter(d=>state.settings.summerOn[ds(d)]).length, chk=state.settings.summerCheck[y];

let jspdfP=null;

  jspdfP=new Promise((res,rej)=>{ const s=document.createElement("script"); s.src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"; s.onload=()=>res(window.jspdf); s.onerror=()=>{ jspdfP=null; rej(new Error("PDF-bibliotheek kon niet laden")); }; document.head.appendChild(s); });
  return jspdfP; }

async function buildPdf(R, cv, paper, withList){
  const {jsPDF}=await loadJsPDF();
  const doc=new jsPDF({orientation:"landscape", unit:"mm", format:paper});
  const pw=doc.internal.pageSize.getWidth(), ph=doc.internal.pageSize.getHeight(), m=8;
  const r=Math.min((pw-2*m)/cv.width,(ph-2*m)/cv.height), w=cv.width*r, h=cv.height*r;
  doc.addImage(cv.toDataURL("image/png"),"PNG",(pw-w)/2,m,w,h,undefined,"FAST");
  if(withList){
    const items=listItems(R); doc.addPage(paper,"landscape");
    const cols=[["Datum",0.17],["Evenement",0.21],["Soort",0.10],["Voorbereiding vanaf",0.15],["Rep.",0.05],["Organisatie",0.16],["Notitie",0.16]];
    const M=14, TW=pw-2*M; let y=M;
    const head=()=>{ doc.setFont("helvetica","bold"); doc.setFontSize(16); doc.setTextColor(26,26,26); doc.text("Overzicht afspraken "+R.label, M, y+4); y+=10;
      doc.setDrawColor(0,118,190); doc.setLineWidth(.6); doc.line(M,y,pw-M,y); y+=6; doc.setFontSize(9); doc.setTextColor(107,107,107);
      let x=M; cols.forEach(([t,f])=>{ doc.text(t.toUpperCase(), x, y); x+=f*TW; }); y+=3; doc.setDrawColor(228,225,216); doc.setLineWidth(.2); doc.line(M,y,pw-M,y); y+=5; };
    // ---- Actie nodig ----
    const acts=URGS.filter(u=>u.level!=="yellow");
    if(acts.length){
      const ac=[["Urgentie",0.11],["Wanneer",0.13],["Evenement",0.22],["Wat is er nodig",0.39],["Aanspreekpunt",0.15]];
      const ahead=()=>{ doc.setFont("helvetica","bold"); doc.setFontSize(16); doc.setTextColor(200,55,45); doc.text("Actie nodig", M, y+4);
        doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(107,107,107);
        doc.text(`Stand ${fmtS(TODAY)} — organisatie niet rond (voorbereiding start binnen 12 maanden) en evenementen die nog gepland moeten worden`, M+34, y+4); y+=10;
        doc.setDrawColor(200,55,45); doc.setLineWidth(.6); doc.line(M,y,pw-M,y); y+=6; doc.setFontSize(9); doc.setTextColor(107,107,107); doc.setFont("helvetica","bold");
        let x=M; ac.forEach(([t,f])=>{ doc.text(t.toUpperCase(), x, y); x+=f*TW; }); y+=3; doc.setDrawColor(228,225,216); doc.setLineWidth(.2); doc.line(M,y,pw-M,y); y+=5; };
      ahead(); doc.setFontSize(10);
      acts.forEach(u=>{ const U=URG[u.level], g=orgOf(u.e,u.y);
        const when = u.kind==="plan" ? (u.e.wishYear?`ergens in ${u.e.wishYear}`:"nog geen jaar") : (()=>{ const o=occurrences(u.e).find(x=>x.y===u.y), m=new Date(u.s*DAY); return o&&o.tbd? `${MONTHS[m.getUTCMonth()]} ${m.getUTCFullYear()}` : fmtS(u.s); })();
        const vals=["",when,u.e.name,u.txt,g.contact||"–"]; let lines=1;
        const wrapped=vals.map((v,i)=>{ doc.setFont("helvetica", i===2?"bold":"normal"); const L=doc.splitTextToSize(String(v), ac[i][1]*TW-3); lines=Math.max(lines,L.length); return L; });
        const rowH=lines*4.4+2.6; if(y+rowH>ph-M){ doc.addPage(paper,"landscape"); y=M; ahead(); doc.setFontSize(10); }
        const rgb=U.c.match(/\w\w/g).map(h=>parseInt(h,16));
        doc.setFillColor(...rgb); doc.roundedRect(M, y-3.6, 22, 5, 2.4, 2.4, "F"); doc.setTextColor(255,255,255); doc.setFont("helvetica","bold"); doc.setFontSize(7.5); doc.text(U.nl.toUpperCase(), M+11, y, {align:"center"}); doc.setFontSize(10);
        let x=M+ac[0][1]*TW;
        wrapped.forEach((L,i)=>{ if(!i) return; doc.setFont("helvetica", i===2?"bold":"normal"); if(i===3) doc.setTextColor(...rgb); else doc.setTextColor(26,26,26); doc.text(L, x, y); x+=ac[i][1]*TW; });
        y+=rowH-2.6+1; doc.setDrawColor(241,238,231); doc.line(M,y,pw-M,y); y+=4.4; });
      y+=8; if(y>ph-M-40){ doc.addPage(paper,"landscape"); y=M; }
    }
    head(); doc.setFontSize(10);
    if(!items.length){ doc.setFont("helvetica","normal"); doc.text("Geen afspraken in deze periode.", M, y); }
    items.forEach(it=>{
      const vals=[it.date,it.name,it.cat,it.prep,it.reps,it.org||"",it.note]; let x=M, lines=1;
      const wrapped=vals.map((v,i)=>{ doc.setFont("helvetica", i===1?"bold":"normal"); const L=doc.splitTextToSize(String(v), cols[i][1]*TW-3); lines=Math.max(lines,L.length); return L; });
      const rowH=lines*4.4+2.6; if(y+rowH>ph-M){ doc.addPage(paper,"landscape"); y=M; head(); doc.setFontSize(10); }
      wrapped.forEach((L,i)=>{ doc.setFont("helvetica", i===1?"bold":"normal"); doc.setTextColor(i===6?107:26, i===6?107:26, i===6?107:26); doc.text(L, x, y); x+=cols[i][1]*TW; });
      y+=rowH-2.6+1; doc.setDrawColor(241,238,231); doc.line(M,y,pw-M,y); y+=4.4; });
    const n=doc.getNumberOfPages(); for(let i=1;i<=n;i++){ doc.setPage(i); doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(154,151,143);
      doc.text(`Brass Band Nuenen · meerjarenplanning · stand ${fmtS(TODAY)} · pagina ${i}/${n}`, M, ph-6); }
  }
  return doc.output("blob");
}

function normalize(st){
  if(!st||!st.events) st={v:1,settings:{},events:[]};
  st.settings=st.settings||{};
  st.settings.hol=Object.assign(Object.fromEntries(HOLS.map(h=>[h[0],true])), st.settings.hol||{});
  if(!Array.isArray(st.settings.vac)) st.settings.vac=VAC_DEFAULT;
  st.settings.summerOn=st.settings.summerOn||{}; st.settings.summerCheck=st.settings.summerCheck||{}; st.settings.repOv=st.settings.repOv||{};
  return st;
}
function setStatus(){
  const s=$("#status"), b=$("#login");
  if(!API){ s.className="status warn"; s.textContent="Niet gekoppeld aan Google Sheet"; b.style.display="none"; return; }
  const t=lastSync? `bijgewerkt ${String(new Date(lastSync).getHours()).padStart(2,"0")}:${String(new Date(lastSync).getMinutes()).padStart(2,"0")}`:"laden…";
  s.className="status "+(PW?"live":"ro"); s.textContent=(PW?"Bewerken aan":"Alleen lezen")+" · "+t;
  b.innerHTML=PW?"Uitloggen":'Inloggen<span class="long"> om te bewerken</span>';
}
async function apiGet(){ const r=await fetch(API+"?action=get"+(READKEY?"&key="+encodeURIComponent(READKEY):"")+"&t="+Date.now()); return r.json(); }
async function apiPost(body){ const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)}); return r.json(); }
const busy=()=>ov.classList.contains("show")||!!drag;
async function sync(force){
  if(!API){ setStatus(); return; }
  try{
    const d=await apiGet();
    if(d.error==="key"){ READKEY=null; try{localStorage.removeItem("bbn-rk");}catch(e){} if(!busy()) readKeyDialog(); return; }
    if(d.error) throw new Error(d.error);
    lastSync=Date.now();
    if(force || (d.version!==VERSION && !busy())){ VERSION=d.version||0; if(d.state) state=normalize(d.state); render(); }
    if(!d.state && force && !VERSION) toast("Nog geen gegevens in de Google Sheet. Log in en gebruik Gegevens → Importeren.");
  }catch(e){ const s=$("#status"); s.className="status warn"; s.textContent="Geen verbinding met de Google Sheet"; return; }
  setStatus();
}

  state.updated = ds(TODAY);
  render();
  if(!API){ toast("Niet gekoppeld: wijziging alleen op dit scherm"); return; }
  if(!PW){ pendingSave=true; loginDialog(); return; }
  try{
    const d=await apiPost({action:"save",pw:PW,base:VERSION,state});
    if(d.ok){ VERSION=d.version; lastSync=Date.now(); setStatus(); toast("Opgeslagen voor iedereen"); return; }
    if(d.error==="auth"){ PW=null; try{localStorage.removeItem("bbn-pw");}catch(e){} setStatus(); pendingSave=true; loginDialog(); return; }
    if(d.error==="conflict"){ toast("Iemand anders sloeg net iets op. Je laatste wijziging is niet bewaard — de nieuwste versie staat nu op je scherm."); VERSION=d.version; state=normalize(d.state); render(); return; }
    toast("Opslaan mislukt: "+d.error);
  }catch(e){ toast("Opslaan mislukt: geen verbinding met de Google Sheet"); }
}

// ---------- drag to change preparation time ----------
let drag=null, justDragged=false;
document.addEventListener("pointerdown",ev=>{
  const g=ev.target.closest(".grip"); if(!g || ev.button>0) return;
  ev.preventDefault(); ev.stopPropagation();
  const e=state.events.find(x=>x.id===g.dataset.grip); if(!e) return;
  const prep=g.parentElement, track=prep.parentElement;
  drag={e, s:+g.dataset.s, prep, g, track, x0:ev.clientX, w0:+e.prepWeeks||0, weeks:+e.prepWeeks||0, moved:false};
  g.classList.add("on"); prep.classList.add("drag"); document.body.classList.add("dragging");
  try{ g.setPointerCapture(ev.pointerId); }catch(_){}
},true);
document.addEventListener("pointermove",ev=>{
  if(!drag) return;
  if(Math.abs(ev.clientX-drag.x0)>3) drag.moved=true;
  const tl=drag.track.getBoundingClientRect().left, day=START+(ev.clientX-tl)/ui.px;
  const w=Math.max(0,Math.min(156,Math.round((drag.s-day)/7)));
  drag.weeks=w;
  const a=drag.s-w*7, X=d=>Math.round((d-START)*ui.px);
  drag.prep.style.left=X(a)+"px"; drag.prep.style.width=(w?Math.max(2,X(drag.s)-X(a)):0)+"px";
  const rec=+drag.e.recur>0;
  tip.innerHTML=`<b>${esc(drag.e.name)}</b><br>Voorbereiding: <b>${w} ${w===1?"week":"weken"}</b>${w?`<br>Start ${fmt(a)}<br><b>${repsBetween(a,drag.s)}</b> repetities`:""}${rec?`<br><i>Geldt voor alle jaren</i>`:""}`;
  tip.style.display="block"; tip.style.left=Math.min(ev.clientX+14,innerWidth-tip.offsetWidth-8)+"px"; tip.style.top=(ev.clientY+18)+"px";
},true);
function endDrag(){
  if(!drag) return; const d=drag; drag=null;
  d.g.classList.remove("on"); d.prep.classList.remove("drag"); document.body.classList.remove("dragging"); tip.style.display="none";
  if(d.moved){ justDragged=true; setTimeout(()=>justDragged=false,50); }
  if(d.moved && d.weeks!==d.w0){ d.e.prepWeeks=d.weeks; commit(); }
  else render();
}
document.addEventListener("pointerup",endDrag,true);
document.addEventListener("pointercancel",endDrag,true);
document.addEventListener("click",ev=>{ if(justDragged || ev.target.closest(".grip")){ ev.stopPropagation(); ev.preventDefault(); } },true);

// ---------- events ----------
document.addEventListener("click",e=>{
  const z=e.target.closest("#zoom .btn");
  if(z){ const sc=$("#scroller"), mid=(sc.scrollLeft+sc.clientWidth/2)/ui.px; ui.px=+z.dataset.px; saveUi(); render(); sc.scrollLeft=mid*ui.px-sc.clientWidth/2; return; }
  if(e.target.closest("#legend [data-vs]")){ ui.vacShade=!ui.vacShade; saveUi(); render(); return; }
  const su=e.target.closest("[data-summer]"); if(su){ tip.style.display="none"; editSummer(+su.dataset.summer); return; }
  if(e.target.id==="vacs") return editVacations();
  const l=e.target.closest("#legend [data-cat]"); if(l){ ui.hidden[l.dataset.cat]=!ui.hidden[l.dataset.cat]; saveUi(); render(); return; }
  const ed=e.target.closest("[data-edit],[data-id]"); if(ed){ tip.style.display="none"; editEvent(ed.dataset.edit||ed.dataset.id); return; }
  if(e.target.id==="add" || e.target.closest("#add")) return editEvent(null);
  const vs=e.target.closest("#viewSw .btn"); if(vs){ ui.view=vs.dataset.view; saveUi(); render(); if(ui.view==="tijdlijn"){ const sc=$("#scroller"); sc.scrollLeft=Math.max(0,(TODAY-START)*ui.px-120); } return; }
  if(e.target.id==="agMore"){ agendaAll=true; renderAgenda(); return; }
  if(e.target.closest("#login")&&e.target.id!=="login"){ $("#login").click(); return; }
  if(e.target.id==="addRep"){ return editEvent(null,{cat:"repetitie",name:"Extra repetitie",prepWeeks:0,date:ds(TODAY+14),note:"20.00–22.00"}); }
  const rp=e.target.closest("[data-rep]"); if(rp){ return editRep(+rp.dataset.rep); }
  const rt=e.target.closest(".reptrack"); if(rt){ const day=START+(e.clientX-rt.getBoundingClientRect().left)/ui.px;
    let best=null; REPS.forEach(r=>{ if(best===null||Math.abs(r.d+.5-day)<Math.abs(best.d+.5-day)) best=r; }); if(best&&Math.abs(best.d+.5-day)<=4){ tip.style.display="none"; return best.evRep? editEvent(best.evRep) : editRep(best.d); } }
  if(e.target.id==="toAct"){ $("#actCard").scrollIntoView({behavior:"smooth",block:"start"}); return; }
  if(e.target.id==="login"){ if(PW){ PW=null; try{localStorage.removeItem("bbn-pw");}catch(_){} setStatus(); toast("Uitgelogd"); } else loginDialog(); return; }
  if(e.target.id==="settings") return editSettings();
  if(e.target.id==="data") return editData();
  if(e.target.id==="export") return exportDialog();
  if(e.target.id==="goToday"){ const sc=$("#scroller"); sc.scrollTo({left:Math.max(0,(TODAY-START)*ui.px-120),behavior:"smooth"}); }
});
if(MIGRATE_ORG){ state.events.forEach(e=>{ if(+e.recur>0 && (e.org||e.contact||e.team)){ e.yr=e.yr||{}; const ys=Object.keys(e.yr).length? Object.keys(e.yr) : [nextOccY(e)].filter(y=>y!=null);
  ys.forEach(y=>{ const o=e.yr[y]||(e.yr[y]={}); if(e.org&&!o.org) o.org=e.org; if(e.contact&&!o.contact) o.contact=e.contact; if(e.team&&!o.team) o.team=e.team; });
  delete e.org; delete e.contact; delete e.team; } }); }
render();
const sc=$("#scroller"); sc.scrollLeft=Math.max(0,(TODAY-START)*ui.px-120);
setStatus(); sync(true); setInterval(()=>sync(false), 60000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) sync(false); });
})();
</script>
</body>
</html>
